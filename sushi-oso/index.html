<style>
:root{
  --sumi:#0C0C0D;
  --sumi-2:#16161A;
  --sumi-3:#1E1E23;
  --washi:#F2EDE1;
  --washi-dim:#A39C8E;
  --beni:#E03A2F;
  --beni-deep:#8E1D18;
  --line:#2A2A2F;
  --ok:#4FB477;
  --warn:#E0A82E;
  --r-s:6px;
  --r-m:12px;
  --shadow:0 18px 40px -18px rgba(0,0,0,.9);
  --max:760px;
  --barh:59px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--sumi);
  color:var(--washi);
  font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--beni);outline-offset:2px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
.display{font-family:'Anton','Archivo Black',Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:.95;text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:60;
  background:rgba(12,12,13,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.bar-in{max-width:var(--max);margin:0 auto;padding:10px 16px;min-height:58px;display:flex;align-items:center;gap:12px;transition:min-height .2s,padding .2s}
body.slim .bar-in{min-height:46px;padding:5px 16px}
body.slim #brandMark{width:28px;height:28px}
body.slim .brand-tx span{display:none}
body.slim .brand-tx b{font-size:14px}
body.slim .bar-cart{padding:6px 12px;font-size:13px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
#brandMark{display:block;width:38px;height:38px;flex:none;border-radius:9px;overflow:hidden;transition:width .2s,height .2s}
.brand-tx{min-width:0}
.brand-tx b{display:block;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:16px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-tx span{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--washi-dim);margin-top:3px}
.bar-cart{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--sumi-2);font-size:14px;font-weight:600}
.bar-cart .n{display:grid;place-items:center;width:20px;height:20px;border-radius:999px;background:var(--beni);color:#fff;font-size:11px;font-weight:700}

/* ---------- hero ---------- */
.hero{position:relative;margin-bottom:6px}
.hero-img{width:100%;height:270px;object-fit:cover;filter:saturate(1.05)}
.hero-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,13,.55) 0%,rgba(12,12,13,.15) 35%,rgba(12,12,13,.92) 88%,var(--sumi) 100%)}
.hero-body{position:relative;margin-top:-92px;padding-bottom:4px}
.stamp{width:96px;height:96px;margin-bottom:12px;padding:7px;background:var(--sumi);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.65)}
.hero h1{margin:0;font-size:clamp(34px,10vw,52px)}
.hero-body h1 em{font-style:normal;color:var(--beni)}
.hero-sub{margin:10px 0 0;color:var(--washi-dim);font-size:14.5px;max-width:46ch}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:6px 12px 6px 9px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.02em;border:1px solid var(--line);background:var(--sumi-2)}
.dot{width:7px;height:7px;border-radius:999px;background:var(--ok);box-shadow:0 0 0 3px rgba(79,180,119,.18)}
.status.shut .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(224,168,46,.18)}

/* ---------- facts strip ---------- */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-block:1px solid var(--line);margin-top:22px}
.fact{background:var(--sumi);padding:13px 10px;text-align:center}
.fact dt{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--washi-dim);margin:0}
.fact dd{margin:5px 0 0;font-size:13px;font-weight:600;line-height:1.25}

.notice{margin:16px 0 0;padding:12px 14px;border-left:3px solid var(--beni);background:var(--sumi-2);border-radius:0 var(--r-s) var(--r-s) 0;font-size:14px}

/* ---------- category rail ---------- */
.rail{position:sticky;top:var(--barh);z-index:50;background:rgba(12,12,13,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-top:22px}
.rail-in{max-width:var(--max);margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:11px 16px;scrollbar-width:none}
.rail-in::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--sumi-2);font-size:13px;font-weight:600;white-space:nowrap;color:var(--washi-dim);transition:.15s}
.chip[aria-current="true"]{background:var(--beni);border-color:var(--beni);color:#fff}

/* ---------- sections ---------- */
section{padding-top:34px;scroll-margin-top:calc(var(--barh) + 56px)}
.sec-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.ring{flex:none;width:34px;height:34px;margin-top:2px}
.sec-head h2{margin:0;font-size:27px}
.sec-head p{margin:5px 0 0;color:var(--washi-dim);font-size:13.5px;max-width:44ch}

.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:repeat(2,1fr)}
@media(min-width:620px){.grid.two{grid-template-columns:repeat(3,1fr)}}

/* wide tile — promos */
.promo{display:grid;grid-template-columns:112px 1fr;gap:0;background:var(--sumi-2);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.promo>img{width:112px;height:100%;min-height:118px;object-fit:cover}
.promo-b{padding:13px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.promo-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.code{font-family:'Anton',Impact,sans-serif;font-size:17px;letter-spacing:.04em}
.hanko{display:inline-flex;align-items:center;gap:4px;background:var(--beni);color:#fff;padding:3px 8px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.promo-d{color:var(--washi-dim);font-size:13px;line-height:1.4;margin:0}
.promo-foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px}
.price{font-family:'Anton',Impact,sans-serif;font-size:21px;color:var(--washi);letter-spacing:.01em}

/* square tile — rolls, sushipletos, salsas */
.tile{background:var(--sumi-2);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column}
.tile-img{position:relative}
.tile-img img{width:100%;aspect-ratio:4/3;object-fit:cover}
.tag{position:absolute;left:8px;bottom:8px;background:var(--washi);color:var(--sumi);font-family:'Anton',Impact,sans-serif;font-size:14px;padding:3px 8px;border-radius:3px;letter-spacing:.01em}
.tile-b{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.tile-b h3{margin:0;font-size:14px;font-weight:600;line-height:1.25}
.tile-b .d{margin:0;font-size:11.5px;color:var(--washi-dim);line-height:1.35}
.tile-b .foot{margin-top:auto;padding-top:6px}

/* add control */
.add{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--beni);color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px;transition:.15s;white-space:nowrap}
.add:hover{background:#ef4a3e}
.add:active{transform:scale(.97)}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--beni);border-radius:999px;overflow:hidden}
.stepper button{width:34px;height:34px;display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--beni);line-height:1}
.stepper button:hover{background:rgba(224,58,47,.12)}
.stepper .q{min-width:26px;text-align:center;font-weight:700;font-size:14px}
.cut{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--washi-dim);cursor:pointer;user-select:none}
.cut input{accent-color:var(--beni);width:15px;height:15px;margin:0}

/* ---------- footer ---------- */
footer{margin-top:46px;border-top:1px solid var(--line);padding:26px 0 34px;font-size:13px;color:var(--washi-dim)}
footer b{color:var(--washi);font-weight:600}
.f-row{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:20px}
.f-row>div{min-width:150px}
.f-row dt{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.linkish{color:var(--washi-dim);text-decoration:underline;text-underline-offset:3px}

/* ---------- sticky order bar ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(12,12,13,0),rgba(12,12,13,.96) 24%);transform:translateY(130%);transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.dock.on{transform:none}
.dock-in{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--beni);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow)}
.dock-in b{font-family:'Anton',Impact,sans-serif;font-size:19px;color:#fff;letter-spacing:.01em}
.dock-in span{font-size:12.5px;color:rgba(255,255,255,.85)}
.dock-in .go{margin-left:auto;background:#fff;color:var(--beni);font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--sumi);border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.7,.3,1)}
.sheet.on{transform:none}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:21px}
.x{margin-left:auto;width:34px;height:34px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);font-size:17px;color:var(--washi-dim)}
.sheet-body{overflow-y:auto;padding:16px 18px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--sumi)}

.line{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-of-type{border-bottom:0}
.line img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none}
.line-b{flex:1;min-width:0}
.line-b h4{margin:0;font-size:13.5px;font-weight:600;line-height:1.3}
.line-b small{color:var(--washi-dim);font-size:11.5px}
.line-p{font-weight:700;font-size:13.5px;white-space:nowrap}

.total{display:flex;align-items:baseline;gap:10px;padding:14px 0 4px;border-top:2px solid var(--line);margin-top:8px}
.total span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--washi-dim)}
.total b{margin-left:auto;font-family:'Anton',Impact,sans-serif;font-size:29px}

.field{margin-bottom:13px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--washi-dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--sumi-2);border:1px solid var(--line);border-radius:9px;padding:12px 13px;color:var(--washi);font:inherit;font-size:15px}
.field textarea{resize:vertical;min-height:64px}
.field input::placeholder,.field textarea::placeholder{color:#615c55}
.segs{display:flex;gap:8px}
.segs button{flex:1;padding:11px 8px;border:1px solid var(--line);border-radius:9px;background:var(--sumi-2);font-size:13.5px;font-weight:600;color:var(--washi-dim)}
.segs button[aria-pressed="true"]{border-color:var(--beni);background:rgba(224,58,47,.14);color:var(--washi)}
.err{color:var(--beni);font-size:12.5px;margin:0 0 10px}

.wa{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:#25D366;color:#04120A;font-weight:700;font-size:16px;padding:15px;border-radius:12px}
.wa:active{transform:scale(.99)}
.wa svg{width:20px;height:20px;flex:none}
.wa-note{margin:9px 0 0;text-align:center;font-size:11.5px;color:var(--washi-dim)}

.empty{text-align:center;padding:40px 10px;color:var(--washi-dim);font-size:14px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);z-index:120;background:var(--washi);color:var(--sumi);font-weight:600;font-size:14px;padding:12px 20px;border-radius:999px;transition:transform .25s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}

.ring svg{display:block;width:100%;height:100%}
#brandMark img,#heroStamp img{width:100%;height:100%;object-fit:contain}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:200;background:var(--washi);color:var(--sumi);padding:8px 12px;border-radius:6px}
.closed-note{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:rgba(224,168,46,.12);border:1px solid var(--warn);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<script>
(function(){
"use strict";

/* ============ data ============ */
var D = null;              // loaded from menu.json
var cart  = {};            // key -> {id, cut, qty}

var CLP = function(n){ return '$' + Math.round(n).toLocaleString('es-CL'); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var img = function(k){ return k || ''; };

/* enso brush ring, drawn once and reused as the section marker */
var RING = '<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="#E03A2F" d="M50 6c25 0 44 19 44 44 0 24-19 44-44 44S6 74 6 50C6 28 22 10 44 6.6 33 11 15 25 15 50c0 20 16 36 35 36s35-16 35-36c0-19-14-34-32-36 -1 0-2 0-3 0z"/></svg>';

/* ============ time / open state ============ */
function nowSCL(){
  var s = new Date().toLocaleString('en-US',{timeZone:'America/Santiago'});
  return new Date(s);
}
function hhmmToMin(t){ var p=String(t||'').split(':'); return (+p[0])*60 + (+(p[1]||0)); }
function minToHHMM(m){
  m=((m%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}
var DAYNAMES=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var DAYSHORT=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var WEEK=[1,2,3,4,5,6,0];
function schedFor(i){
  var ds = D.config.days;
  return (ds && ds[i]) || {closed:false, open:D.config.open||'14:00', close:D.config.close||'23:00'};
}
function todaySched(){ return schedFor(nowSCL().getDay()); }
function isOpen(){
  var t = todaySched(); if(t.closed) return false;
  var n = nowSCL(); var cur = n.getHours()*60 + n.getMinutes();
  var o = hhmmToMin(t.open), c = hhmmToMin(t.close);
  return c > o ? (cur>=o && cur<c) : (cur>=o || cur<c);
}
function nextOpenLabel(){
  var n = nowSCL(), day = n.getDay(), cur = n.getHours()*60 + n.getMinutes();
  var t = todaySched();
  if(!t.closed && cur < hhmmToMin(t.open)) return 'abrimos hoy a las ' + t.open;
  for(var k=1;k<=7;k++){
    var s = schedFor((day+k)%7);
    if(!s.closed) return 'abrimos el ' + DAYNAMES[(day+k)%7].toLowerCase() + ' a las ' + s.open;
  }
  return 'sin horario cargado';
}
function pickupSlots(){
  var t = todaySched(); if(t.closed) return [];
  var n = nowSCL(); var cur = n.getHours()*60 + n.getMinutes();
  var o = hhmmToMin(t.open), c = hhmmToMin(t.close);
  var start = Math.max(o, cur + (D.config.prepMax||40));
  start = Math.ceil(start/15)*15;
  var out = [];
  for(var m=start; m<=c-10 && out.length<28; m+=15) out.push(minToHHMM(m));
  return out;
}
/* collapse consecutive days that share a schedule: "Lun a Vie 14:00–23:00" */
function scheduleSummary(){
  var groups=[], cur=null;
  WEEK.forEach(function(i){
    var s=schedFor(i), sig = s.closed ? 'x' : s.open+'>'+s.close;
    if(cur && cur.sig===sig) cur.to=i;
    else { cur={sig:sig, from:i, to:i, s:s}; groups.push(cur); }
  });
  return groups.map(function(g){
    var lbl = g.from===g.to ? DAYSHORT[g.from] : DAYSHORT[g.from]+' a '+DAYSHORT[g.to];
    return lbl+' '+(g.s.closed ? 'cerrado' : g.s.open+'–'+g.s.close);
  });
}

/* ============ cart ============ */
function itemById(id){ for(var i=0;i<D.items.length;i++) if(D.items[i].id===id) return D.items[i]; return null; }
function keyOf(id,cut){ return cut ? id+'|c' : id; }
function qty(id,cut){ var e=cart[keyOf(id,cut)]; return e?e.qty:0; }
function unitPrice(it,cut){ return it.price + (cut ? (D.config.cutFee||500) : 0); }
function setQty(id,cut,q){
  var k=keyOf(id,cut);
  if(q<=0) delete cart[k]; else cart[k]={id:id,cut:!!cut,qty:q};
  saveCart(); paintQty(); paintTotals(); if(sheetOpen==='cart') renderCart();
}
function cartLines(){
  var out=[];
  for(var k in cart){
    var e=cart[k], it=itemById(e.id);
    if(it && it.active!==false) out.push({it:it,cut:e.cut,qty:e.qty,sub:unitPrice(it,e.cut)*e.qty});
  }
  return out;
}
function cartTotal(){ return cartLines().reduce(function(a,l){return a+l.sub;},0); }
function cartCount(){ return cartLines().reduce(function(a,l){return a+l.qty;},0); }
function saveCart(){ try{ localStorage.setItem('oso-cart', JSON.stringify(cart)); }catch(e){} }
function loadCart(){
  try{ var r=localStorage.getItem('oso-cart'); if(r) cart=JSON.parse(r)||{}; }catch(e){ cart={}; }
}

/* ============ render: menu ============ */
function render(){
  document.getElementById('bName').textContent  = D.config.name;
  document.getElementById('bWhere').textContent = D.config.commune;
  document.getElementById('tagline').textContent = D.config.tagline;
  document.getElementById('heroImg').src = img(D.config.heroImg);
  document.getElementById('brandMark').innerHTML = '<img src="logo.svg" alt="" width="38" height="38">';
  document.getElementById('heroStamp').innerHTML = '<img src="logo.svg" alt="Logo Sushi adonde el Oso" width="82" height="82">';

  paintStatus();

  document.getElementById('facts').innerHTML =
    fact('Retiro','Solo en local') +
    fact('Listo en', D.config.prepMin+'&ndash;'+D.config.prepMax+' min') +
    fact('Pago','Al retirar');

  var nb = document.getElementById('noticeBox');
  nb.innerHTML = D.config.notice ? '<p class="notice">'+esc(D.config.notice)+'</p>' : '';

  var cats = D.cats.filter(function(c){
    return D.items.some(function(x){ return x.cat===c.id && x.active!==false && x.name; });
  });
  document.getElementById('rail').innerHTML = cats.map(function(c,i){
    return '<button class="chip" type="button" data-jump="'+c.id+'"'+(i===0?' aria-current="true"':'')+'>'+esc(c.name)+'</button>';
  }).join('');

  document.getElementById('menu').innerHTML = cats.map(function(c){
    var its = D.items.filter(function(x){ return x.cat===c.id && x.active!==false && x.name; });
    if(!its.length) return '';
    return '<section id="'+c.id+'">' +
      '<div class="sec-head"><div class="ring">'+RING+'</div>' +
      '<div><h2 class="display">'+esc(c.name)+'</h2>' +
      (c.note ? '<p>'+esc(c.note)+'</p>' : '') + '</div></div>' +
      (c.layout==='wide'
        ? '<div class="grid">'+its.map(promoTile).join('')+'</div>'
        : '<div class="grid two">'+its.map(function(it){return sqTile(it,c);}).join('')+'</div>') +
      '</section>';
  }).join('');

  document.getElementById('fInfo').innerHTML =
    finfo('Dirección', esc(D.config.address)+'<br>'+esc(D.config.commune)) +
    finfo('Horario', scheduleSummary().join('<br>')) +
    finfo('WhatsApp','<a class="linkish" href="https://wa.me/'+D.config.wa+'">+'+D.config.wa+'</a>');

  paintQty(); paintTotals();
}
function paintStatus(){
  var open = isOpen();
  document.getElementById('statusBox').innerHTML =
    '<span class="status'+(open?'':' shut')+'"><i class="dot"></i>'+
    (open ? 'Abierto ahora &middot; cerramos a las '+todaySched().close
          : 'Cerrado &middot; '+nextOpenLabel())+'</span>';
}
function fact(t,v){ return '<div class="fact"><dt>'+t+'</dt><dd>'+v+'</dd></div>'; }
function finfo(t,v){ return '<div><dt>'+t+'</dt><dd style="margin:0"><b>'+v+'</b></dd></div>'; }

function promoTile(it){
  return '<article class="promo">' +
    '<img src="'+img(it.img)+'" alt="'+esc(it.name)+'" loading="lazy">' +
    '<div class="promo-b">' +
      '<div class="promo-top"><span class="code">'+esc(it.name)+'</span>' +
      (it.unit ? '<span class="hanko">'+esc(it.unit)+'</span>' : '') + '</div>' +
      '<p class="promo-d">'+esc(it.desc)+'</p>' +
      '<div class="promo-foot"><span class="price tnum">'+CLP(it.price)+'</span>' +
        '<span style="margin-left:auto" data-ctl="'+it.id+'"></span>' +
      '</div>' +
    '</div></article>';
}
function sqTile(it,c){
  return '<article class="tile">' +
    '<div class="tile-img"><img src="'+img(it.img)+'" alt="'+esc(it.name)+'" loading="lazy">' +
    '<span class="tag tnum">'+CLP(it.price)+'</span></div>' +
    '<div class="tile-b"><h3>'+esc(it.name)+'</h3>' +
    (it.desc ? '<p class="d">'+esc(it.desc)+'</p>' : '') +
    '<div class="foot">' +
      (c.cut ? '<label class="cut"><input type="checkbox" data-cut="'+it.id+'"> Cortado +'+CLP(D.config.cutFee)+'</label>' : '') +
      '<div style="margin-top:7px" data-ctl="'+it.id+'"></div>' +
    '</div></div></article>';
}

/* add / stepper controls, repainted from cart state */
function paintQty(){
  document.querySelectorAll('[data-ctl]').forEach(function(box){
    var id = box.getAttribute('data-ctl');
    var cutBox = document.querySelector('[data-cut="'+id+'"]');
    var cut = !!(cutBox && cutBox.checked);
    var q = qty(id,cut);
    box.innerHTML = q>0
      ? '<span class="stepper"><button type="button" data-dec="'+id+'" aria-label="Quitar uno">&minus;</button>' +
        '<span class="q tnum">'+q+'</span>' +
        '<button type="button" data-inc="'+id+'" aria-label="Agregar uno">+</button></span>'
      : '<button class="add" type="button" data-inc="'+id+'">Agregar</button>';
  });
}
function paintTotals(){
  var n = cartCount(), t = cartTotal();
  document.getElementById('topN').textContent = n;
  document.getElementById('topT').textContent = CLP(t);
  document.getElementById('dockT').textContent = CLP(t);
  document.getElementById('dockN').textContent = n===1 ? '1 producto' : n+' productos';
  document.getElementById('dock').classList.toggle('on', n>0 && sheetOpen===null);
}

/* ============ sheets ============ */
var sheetOpen = null;
function openSheet(which){
  sheetOpen = which;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('cartSheet').classList.add('on');
  document.body.style.overflow='hidden';
  paintTotals();
}
function closeSheet(){
  sheetOpen = null;
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('cartSheet').classList.remove('on');
  document.body.style.overflow='';
  paintTotals();
}

/* ============ cart sheet ============ */
var form = { name:'', phone:'', when:'asap', slot:'', pay:'efectivo', note:'' };
function renderCart(){
  var lines = cartLines();
  var body = document.getElementById('cartBody');
  var foot = document.getElementById('cartFoot');

  if(!lines.length){
    body.innerHTML = '<p class="empty">Todavía no agregas nada.<br>Elige del menú y vuelve acá.</p>';
    foot.innerHTML = '';
    return;
  }

  var slots = pickupSlots();
  if(form.when==='slot' && slots.indexOf(form.slot)<0) form.slot = slots[0] || '';
  body.innerHTML =
    (isOpen() ? '' : '<p class="closed-note">Ahora estamos cerrados ('+nextOpenLabel()+'). Puedes dejar el pedido armado; lo vemos cuando abramos.</p>') +
    lines.map(function(l){
      return '<div class="line"><img src="'+img(l.it.img)+'" alt="">' +
        '<div class="line-b"><h4>'+esc(l.it.name)+'</h4>' +
        '<small>'+CLP(unitPrice(l.it,l.cut))+' c/u'+(l.cut?' &middot; cortado':'')+'</small>' +
        '<div style="margin-top:7px"><span class="stepper">' +
          '<button type="button" data-cdec="'+l.it.id+'|'+(l.cut?1:0)+'">&minus;</button>' +
          '<span class="q tnum">'+l.qty+'</span>' +
          '<button type="button" data-cinc="'+l.it.id+'|'+(l.cut?1:0)+'">+</button>' +
        '</span></div></div>' +
        '<span class="line-p tnum">'+CLP(l.sub)+'</span></div>';
    }).join('') +
    '<div class="total"><span>Total</span><b class="tnum">'+CLP(cartTotal())+'</b></div>' +

    '<div style="margin-top:22px">' +
      '<div class="field"><label for="fN">Tu nombre</label>' +
        '<input id="fN" type="text" autocomplete="name" placeholder="Camila Rojas" value="'+esc(form.name)+'"></div>' +
      '<div class="field"><label for="fP">Teléfono</label>' +
        '<input id="fP" type="tel" inputmode="tel" autocomplete="tel" placeholder="9 8765 4321" value="'+esc(form.phone)+'"></div>' +
      '<div class="field"><label>¿Para cuándo?</label><div class="segs">' +
        '<button type="button" data-when="asap" aria-pressed="'+(form.when==='asap')+'">Lo antes posible</button>' +
        '<button type="button" data-when="slot" aria-pressed="'+(form.when==='slot')+'">Elegir hora</button>' +
      '</div></div>' +
      (form.when==='slot'
        ? '<div class="field"><label for="fS">Hora de retiro</label><select id="fS">' +
          (slots.length ? slots.map(function(s){
            return '<option value="'+s+'"'+(form.slot===s?' selected':'')+'>'+s+'</option>'; }).join('')
           : '<option value="">Hoy ya no alcanzamos</option>') +
          '</select></div>'
        : '') +
      '<div class="field"><label>Forma de pago</label><div class="segs">' +
        '<button type="button" data-pay="efectivo" aria-pressed="'+(form.pay==='efectivo')+'">Efectivo</button>' +
        '<button type="button" data-pay="transferencia" aria-pressed="'+(form.pay==='transferencia')+'">Transferencia</button>' +
      '</div></div>' +
      '<div class="field"><label for="fC">Algo más que debamos saber</label>' +
        '<textarea id="fC" placeholder="Sin cebollín, salsa extra, etc.">'+esc(form.note)+'</textarea></div>' +
    '</div>';

  foot.innerHTML =
    '<p class="err" id="fErr" hidden></p>' +
    '<button class="wa" id="waGo" type="button">' +
      '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 1.9 1.1.9 2 1.2 2.3 1.4.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l2 .9c.2.1.4.2.4.3.1.2.1.8-.1 1.4z"/></svg>' +
      'Enviar pedido por WhatsApp</button>' +
    '<p class="wa-note">Se abre WhatsApp con el pedido escrito. Tú aprietas enviar.</p>';
}

function readForm(){
  var g=function(id){ var e=document.getElementById(id); return e?e.value.trim():''; };
  form.name = g('fN'); form.phone = g('fP'); form.note = g('fC');
  var s=document.getElementById('fS'); if(s) form.slot = s.value;
}
function buildMessage(){
  var lines = cartLines();
  var L = [];
  L.push('*NUEVO PEDIDO* — '+D.config.name);
  L.push('');
  L.push('*Cliente:* '+form.name);
  L.push('*Teléfono:* '+form.phone);
  L.push('');
  L.push('*Pedido*');
  lines.forEach(function(l){
    L.push('• '+l.qty+'x '+l.it.name+(l.cut?' (cortado)':'')+' — '+CLP(l.sub));
  });
  L.push('');
  L.push('*TOTAL: '+CLP(cartTotal())+'*');
  L.push('');
  L.push('Retiro en local — '+D.config.address+', '+D.config.commune);
  L.push('Hora: '+(form.when==='slot' && form.slot ? form.slot : isOpen() ? 'lo antes posible ('+D.config.prepMin+'-'+D.config.prepMax+' min)' : 'apenas abran ('+nextOpenLabel()+')'));
  L.push('Paga al retirar: '+form.pay);
  if(form.note){ L.push(''); L.push('*Nota:* '+form.note); }
  return L.join('\n');
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('on'); }, 3200);
}

/* ============ events ============ */
document.addEventListener('click', function(e){
  var t = e.target.closest('button, [data-close]');
  if(!t) return;
  var a;

  if(t.hasAttribute('data-close') || t===document.getElementById('scrim')){ closeSheet(); return; }

  if((a=t.getAttribute('data-jump'))){
    document.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-current', String(c===t)); });
    var s=document.getElementById(a); if(s) s.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if((a=t.getAttribute('data-inc'))){
    var cb=document.querySelector('[data-cut="'+a+'"]');
    setQty(a, !!(cb&&cb.checked), qty(a, !!(cb&&cb.checked))+1); return;
  }
  if((a=t.getAttribute('data-dec'))){
    var cb2=document.querySelector('[data-cut="'+a+'"]');
    setQty(a, !!(cb2&&cb2.checked), qty(a, !!(cb2&&cb2.checked))-1); return;
  }
  if((a=t.getAttribute('data-cinc'))){ var p=a.split('|'); setQty(p[0], p[1]==='1', qty(p[0],p[1]==='1')+1); return; }
  if((a=t.getAttribute('data-cdec'))){ var q=a.split('|'); setQty(q[0], q[1]==='1', qty(q[0],q[1]==='1')-1); return; }

  if(t.id==='topCart' || t.id==='dockGo'){ renderCart(); openSheet('cart'); return; }

  if((a=t.getAttribute('data-when'))){ readForm(); form.when=a; renderCart(); return; }
  if((a=t.getAttribute('data-pay'))){  readForm(); form.pay=a;  renderCart(); return; }

  if(t.id==='waGo'){
    readForm();
    var err = document.getElementById('fErr');
    if(!form.name || form.phone.replace(/[^0-9]/g,'').length < 8){
      err.textContent = 'Necesitamos tu nombre y un teléfono para confirmarte el pedido.';
      err.hidden = false; return;
    }
    err.hidden = true;
    var url = 'https://wa.me/'+D.config.wa+'?text='+encodeURIComponent(buildMessage());
    if(!window.open(url, '_blank')) location.href = url;   // popup blocked (iOS in-app browsers)
    return;
  }

}, false);

document.getElementById('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && sheetOpen) closeSheet(); });
document.addEventListener('change', function(e){
  if(e.target.matches('[data-cut]')) paintQty();
});

/* highlight the category you are reading */
var spy = function(){
  var best=null, bd=1e9;
  document.querySelectorAll('main section').forEach(function(s){
    var d = Math.abs(s.getBoundingClientRect().top - 120);
    if(d<bd){ bd=d; best=s.id; }
  });
  document.querySelectorAll('.chip').forEach(function(c){
    c.setAttribute('aria-current', String(c.getAttribute('data-jump')===best));
  });
};
var spyT; window.addEventListener('scroll', function(){
  clearTimeout(spyT); spyT=setTimeout(spy,120);
  var slim = window.scrollY > 90;
  if(slim !== document.body.classList.contains('slim')){
    document.body.classList.toggle('slim', slim);
    document.documentElement.style.setProperty('--barh', slim ? '47px' : '59px');
  }
}, {passive:true});

/* ============ boot ============ */
loadCart();
fetch('menu.json',{cache:'no-cache'})
  .then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(d){
    D = d; render();
    setInterval(paintStatus, 60000);   // keep open/closed status fresh
  })
  .catch(function(){
    document.getElementById('menu').innerHTML =
      '<p class="empty">No pudimos cargar el menú. Recarga la página o escríbenos por WhatsApp.</p>';
  });

})();
</script>
